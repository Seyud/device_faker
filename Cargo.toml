[workspace]
members = ["xtask"]
exclude = ["device_faker_cli"]

[package]
name = "device_faker"
version = "1.6.0"
edition = "2024"
authors = ["Seyud"]

[dependencies]
anyhow = { version = "1.0.102", default-features = false }
jni = { version = "0.22", default-features = false }
log = { version = "^0.4", default-features = false }
serde = { version = "1.0.228", features = ["derive", "std"] }
toml = { version = "1.0", features = ["parse"] }
zygisk-api = { git = "https://github.com/Seyud/zygisk-api-rs.git" }
serde_json = "1.0.149"
libc = "0.2"
prop-rs-android = { git = "https://github.com/KernelSU2/ksu_props", rev = "ddb6ee7294467f7f25bad2118e9e24eee104144b" }
memmap2 = "0.9.11"
# 前台 UidObserver：root binder 注册 ActivityManager.registerUidObserver，
# 事件驱动接收 PROCESS_STATE_TOP 变化。
rsbinder = { version = "0.10", features = ["android_10_plus"] }
async-trait = "0.1"

[build-dependencies]
rsbinder-aidl = "0.10"

[lib]
name = "zygisk"
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
lto = "fat"
opt-level = 3
strip = true
codegen-units = 1
overflow-checks = false
