# ============================================================
# 配置说明
# ============================================================
#
# 【架构】按需调度（无需选择模式）
#
# 所有应用自动走统一执行流：
#   ① Build 字段覆写 (JNI)      — 始终执行（如有设备字段）
#   ② 属性伪装                   — 默认严格 COW：属性写进本进程私有的
#                                  属性区副本，只影响本进程，绝不降级为
#                                  全局写入；companion_resetprop = true 时
#                                  在 COW 之外再由 companion 直写全局属性
#   ③ DPI 伪装                   — 按需（仅设置 dpi 时）
#   ④ DlClose                    — 始终执行（零模块驻留）
#
# 用户不再需要理解 lite/full/companion 的区别。
#
# 【配置方式】
# 1. 模板包名列表 - 在模板的 packages 中直接添加包名
# 2. 直接配置 - 使用 [[apps]] 直接指定设备信息
#
# 【优先级】
# 字段优先级：[[apps]] 直接配置 > 模板 packages 列表
#
# 【COW 引擎】
# - 为本进程复制一份属性区（MAP_PRIVATE|MAP_ANONYMOUS 匿名副本），把 bionic
#   属性后端的 context 节点指向副本，再在副本上改写属性
# - 覆盖 __system_property_get 和 __system_property_read_callback 的 native 读取
# - 真实的 /dev/__properties__/* 映射保持只读、原样不动，
#   /proc/self/maps 里不会留下 rw-p 写映射指纹
# - 无 GOT/PLT 修改，无 JNI native method 替换
# - 模块写完即 DlClose，进程里不残留模块映射
#
# 【__DELETE__ 标记】
# 设置属性值为 "__DELETE__" 可通过 companion resetprop 删除该属性
# （仅在 companion_resetprop = true 时真正执行；默认严格 COW 下会跳过并记 WARN）。
# 设置属性值为 "__EMPTY__" 将属性值设为空字符串。
#
# 【DPI 伪装】
# 在模板或 [[apps]] 中设置 dpi = 420。
# 保存原始值，并在应用退后台/退出后自动恢复（切后台约 0.5s 后恢复）。
